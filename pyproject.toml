[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "baltic-sales-intelligence"
version = "0.2.0"
description = "Synthetic data and analytics for a fictional Baltic B2B case study."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Paul Alford" }]
dependencies = [
  "numpy>=2.1,<3",
  "duckdb>=1.1,<2",
  "pandas>=2.2,<4",
  "pandera>=0.20,<1",
  "plotly>=5.24,<7",
  "pyarrow>=16,<24",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "statsmodels>=0.14,<1",
  "streamlit>=1.39,<2",
]

[project.optional-dependencies]
dev = [
  "hatchling==1.27.0",
  "pip-tools>=7.4,<8",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.7,<1",
]

[project.scripts]
bsi-pipeline = "baltic_sales_intelligence.pipeline.cli:entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["src/baltic_sales_intelligence"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["baltic_sales_intelligence"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"app/*.py" = ["E402"]
